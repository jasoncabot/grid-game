<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
    <title>Chain Reaction</title>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8141686851494301"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="app">
      <div id="board-wrapper">
        <div id="board"></div>
      </div>
      <div id="ui">
        <div id="scores">
          <div id="score-line">Score:&thinsp;<span id="score-value">0</span></div>
          <div id="best-line">Best:&thinsp;&thinsp;<span id="best-value">0</span></div>
        </div>
        <div id="ui-actions">
          <button id="reset-button">Reset</button>
          <button id="share-button" aria-label="Share">
            <img width="20" height="20" src="/share.svg" alt="" />
          </button>
        </div>
      </div>
    </div>

    <!-- Full-screen overlay for camera-flash effect -->
    <div id="flash-overlay" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
